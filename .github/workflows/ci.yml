name: CI

# Validate, test, build, and smoke the stdio server. Modeled on the
# aifam-mcp workflow in lucia_tooling_omzsh: read-only permissions,
# hardened runner, SHA-pinned actions. Nothing here publishes or pushes.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  test:
    name: validate, test, build (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check, lint, format
        run: npm run validate

      - name: CHANGELOG format
        run: npm run verify:changelog

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: Tests with coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build:fast

      - name: Server answers initialize over stdio
        env:
          NODE_ENV: production
          METABASE_URL: https://test.metabase.local
          METABASE_API_KEY: ci-dummy-key
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 15s node build/src/index.js 2>/dev/null \
            | head -1 \
            | grep -q '"serverInfo":{"name":"luci-metabase-mcp"'

      - name: Server fails loudly without configuration
        env:
          NODE_ENV: production
        run: |
          set +e
          out=$(timeout 10s node build/src/index.js 2>&1 </dev/null)
          rc=$?
          set -e
          echo "$out" | grep -q "Environment validation failed"
          test "$rc" -ne 0

      - name: Server rejects a malformed 1Password reference
        env:
          NODE_ENV: production
          METABASE_URL: https://test.metabase.local
          METABASE_API_KEY: "op://bad"
        run: |
          set +e
          out=$(timeout 10s node build/src/index.js 2>&1 </dev/null)
          rc=$?
          set -e
          echo "$out" | grep -q "Invalid 1Password secret reference"
          test "$rc" -ne 0

      - name: MCPB manifest
        run: npm run mcpb:validate

  container:
    name: internal container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build image (never pushed)
        run: docker build -t luci-metabase-mcp:local .

      - name: Container answers initialize over stdio
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 20s docker run --rm -i -e METABASE_URL=https://test.metabase.local -e METABASE_API_KEY=ci-dummy luci-metabase-mcp:local 2>/dev/null \
            | head -1 \
            | grep -q '"serverInfo"'

      - name: Container fails without configuration
        run: |
          set +e
          out=$(timeout 10s docker run --rm luci-metabase-mcp:local 2>&1)
          set -e
          echo "$out" | grep -q "Environment validation failed"

  mcpb:
    name: MCP bundle artifact (tags only)
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build:fast && node scripts/build-mcpb.cjs && ls -la *.mcpb

      - name: Upload bundle as a workflow artifact (internal distribution)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: luci-metabase-mcp-mcpb
          path: "*.mcpb"
          retention-days: 30
